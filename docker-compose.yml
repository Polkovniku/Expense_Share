services:
  expense-db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - expense_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      retries: 5

  service:
    build: ./
    container_name: distributed_api
    env_file:
      - .env
    ports:
    - "8000:8000"
    depends_on:
      expense-db:
        condition: service_healthy
    command: sh -c "uv run alembic upgrade head && uv run uvicorn main:app --host 0.0.0.0 --port 8000"
      
  
  
volumes:
  expense_data:
